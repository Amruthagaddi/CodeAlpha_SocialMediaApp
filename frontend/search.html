<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Users - PulseSocial</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-container">
  <!-- Top Dynamic Navbar -->
  <div id="navbar-root"></div>

  <main class="main-content">
    <div class="search-header">
      <form id="search-form" class="search-input-wrapper">
        <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" id="search-user-input" class="search-input-large" placeholder="Search by name or @username..." autocomplete="off">
      </form>
    </div>

    <!-- Search User Results Grid -->
    <div class="user-results-grid" id="search-results-container">
      <div style="grid-column: 1 / -1;" class="loading-spinner">
        <div class="spinner"></div>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/search.js"></script>
</body>
</html>

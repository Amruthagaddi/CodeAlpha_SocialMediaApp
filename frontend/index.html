<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Feed - Mitra</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-container">
  <!-- Top Dynamic Navbar -->
  <div id="navbar-root"></div>

  <!-- Main Feed Container -->
  <main class="main-content">
    <div class="feed-grid">
      <!-- Left Sidebar: Logged-in User Info Widget -->
      <aside class="left-sidebar" id="user-profile-widget">
        <!-- Rendered dynamically by feed.js -->
      </aside>

      <!-- Center Feed Area -->
      <section class="center-feed">
        <!-- Quick Create Post Widget -->
        <div class="card" style="margin-bottom: 1.5rem;">
          <div class="create-post-widget">
            <a href="profile.html" id="quick-user-avatar-link">
              <div class="avatar-placeholder avatar-md">M</div>
            </a>
            <div class="post-input-box">
              <button onclick="window.location.href='create-post.html'" class="quick-post-trigger">What's on your mind?</button>
            </div>
          </div>
        </div>

        <!-- Feed Heading -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
          <h2 style="font-size: 1.25rem; font-weight: 800;">Recent Feed</h2>
          <button onclick="loadFeedPosts()" class="btn btn-outline btn-sm" style="gap: 0.35rem;">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            Refresh
          </button>
        </div>

        <!-- Dynamic Feed Posts List -->
        <div id="posts-feed-container">
          <div class="loading-spinner">
            <div class="spinner"></div>
          </div>
        </div>
      </section>

      <!-- Right Sidebar: Suggested Creators & Trending Topics -->
      <aside class="right-sidebar">
        <div class="card" style="margin-bottom: 1.25rem;">
          <h3 class="suggested-users-title" style="margin-bottom: 0.75rem;">🔥 Trending Topics</h3>
          <div id="trending-hashtags-container">
            <!-- Rendered dynamically by feed.js -->
          </div>
        </div>

        <div class="card">
          <h3 class="suggested-users-title">Registered Members</h3>
          <div id="suggested-users-list">
            <!-- Rendered dynamically by feed.js -->
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script src="js/auth.js?v=2"></script>
  <script src="js/feed.js?v=2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = getStoredUser();
      const link = document.getElementById('quick-user-avatar-link');
      if (link && user) {
        link.innerHTML = renderAvatarHTML(user, 'avatar-md');
      }
    });
  </script>
</body>
</html>
